services:
  frontend:
    build:
      target: development
    command: ["sh", "-c", "npm install && exec npm run next -- --hostname 0.0.0.0"]
    environment:
      NODE_ENV: development
      API_BASE_URL: http://mock:4000
      # 채팅 STOMP. 브라우저가 호스트에서 바로 연결하므로 localhost 주소입니다 (Next rewrites는 WebSocket을 전달하지 않음)
      NEXT_PUBLIC_WS_URL: ws://localhost:4000/api/v1/ws
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      mock:
        condition: service_healthy

  mock:
    image: node:24-bookworm-slim
    working_dir: /app
    command: ["node", "--watch", "--disable-warning=ExperimentalWarning", "mocks/server.ts"]
    environment:
      MOCK_PORT: "4000"
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./frontend/mocks:/app/mocks:ro
      # 일부 핸들러가 src의 순수 함수(신고 미리보기 등)를 import합니다.
      - ./frontend/src:/app/src:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/me').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # 코드를 고치면 docker compose restart backend, backend/.env를 고치면 docker compose up -d backend로 반영합니다.
  backend:
    # compose.yml로 만드는 실행용 이미지(pickong-backend)와 섞이지 않게 이름을 나눕니다.
    image: pickong-backend-dev
    build:
      target: development
    command: ["./gradlew", "bootRun", "--no-daemon"]
    # JWT_SECRET 등 비밀값 (backend/.env.example 참고). 파일이 없어도 프론트 · mock · db는 실행할 수 있습니다.
    env_file:
      - path: ./backend/.env
        required: false
    # env_file보다 우선합니다.
    environment:
      DB_URL: jdbc:postgresql://db:5432/pickong
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./backend:/app
      - backend_build:/app/build
      - backend_gradle:/app/.gradle
      - backend_gradle_home:/root/.gradle
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v1/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      # 처음에는 Gradle과 의존성을 내려받아 오래 걸립니다.
      start_period: 180s

  # 로컬 개발용 DB. 백엔드를 Docker 없이 실행할 때는 이것만 띄웁니다. (docker compose up -d db)
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: pickong
      POSTGRES_USER: pickong
      POSTGRES_PASSWORD: pickong # 로컬 전용 값. 운영 DB 비밀번호는 환경변수로만 넣습니다.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pickong -d pickong"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 채팅 실시간 전달의 서버 간 중계(선택). 기본으로는 켜지 않습니다. 백엔드는 REDIS_HOST가 없으면 Redis 없이 서버 안에서만 전달합니다.
  # 써 보려면: docker compose --profile redis up -d redis → backend/.env에 REDIS_HOST (bootRun이면 localhost, Docker 백엔드면 redis)
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  frontend_node_modules:
  frontend_next:
  backend_build:
  backend_gradle:
  backend_gradle_home:
  db_data:
