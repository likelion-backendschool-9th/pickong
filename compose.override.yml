services:
  frontend:
    build:
      target: development
    command: ["sh", "-c", "npm ci && exec npm run next -- --hostname 0.0.0.0"]
    environment:
      NODE_ENV: development
      API_BASE_URL: http://mock:4000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      mock:
        condition: service_healthy

  mock:
    image: node:24-bookworm-slim
    working_dir: /app
    command: ["node", "--watch", "--disable-warning=ExperimentalWarning", "mocks/server.ts"]
    environment:
      MOCK_PORT: "4000"
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./frontend/mocks:/app/mocks:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/me').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  frontend_node_modules:
  frontend_next:
