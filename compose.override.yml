services:
  frontend:
    build:
      target: development
    command: ["sh", "-c", "npm install && exec npm run next -- --hostname 0.0.0.0"]
    environment:
      NODE_ENV: development
      API_BASE_URL: http://mock:4000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      mock:
        condition: service_healthy

  mock:
    image: node:24-bookworm-slim
    working_dir: /app
    command: ["node", "--watch", "--disable-warning=ExperimentalWarning", "mocks/server.ts"]
    environment:
      MOCK_PORT: "4000"
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./frontend/mocks:/app/mocks:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/me').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # JWT_SECRET 등 비밀값은 backend/.env에서 읽습니다. (backend/.env.example 참고)
  # 코드를 고치면 docker compose restart backend로 다시 실행합니다.
  backend:
    build:
      target: development
    command: ["./gradlew", "bootRun", "--no-daemon"]
    environment:
      DB_URL: jdbc:postgresql://db:5432/pickong
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./backend:/app
      - backend_build:/app/build
      - backend_gradle:/app/.gradle
      - backend_gradle_home:/root/.gradle
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v1/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      # 처음에는 Gradle과 의존성을 내려받아 오래 걸립니다.
      start_period: 180s

  # 로컬 개발용 DB. 백엔드를 Docker 없이 실행할 때는 이것만 띄웁니다. (docker compose up -d db)
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: pickong
      POSTGRES_USER: pickong
      POSTGRES_PASSWORD: pickong # 로컬 전용 값. 운영 DB 비밀번호는 환경변수로만 넣습니다.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pickong -d pickong"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  frontend_node_modules:
  frontend_next:
  backend_build:
  backend_gradle:
  backend_gradle_home:
  db_data:
